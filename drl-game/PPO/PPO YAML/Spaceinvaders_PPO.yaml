# Space Invaders PPO
# Wave-based shooter - benefits from longer rollouts to capture full waves
run_name: spaceinvaders_ppo_v0
env_id: ALE/SpaceInvaders-v5
seed: 42
total_timesteps: 10_000_000
n_envs: 8

log_dir:  drl-game/data/runs/spaceinvaders_ppo_v0
save_dir: drl-game/data/models/spaceinvaders_ppo_v0

ppo:
  learning_rate: 2.5e-4
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

eval:
  enabled: true
  freq: 100_000
  n_episodes: 5
  deterministic: true