# BeamRider PPO
# Fast-paced shooter - PPO handles the timing-sensitive action space well
run_name: beamrider_ppo_v0
env_id: ALE/BeamRider-v5
seed: 42
total_timesteps: 10_000_000
n_envs: 8

log_dir:  drl-game/data/runs/beamrider_ppo_v0
save_dir: drl-game/data/models/beamrider_ppo_v0

ppo:
  learning_rate: 2.5e-4
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.01               # Slightly higher entropy for exploration in shooter
  vf_coef: 0.5
  max_grad_norm: 0.5

eval:
  enabled: true
  freq: 100_000
  n_episodes: 5
  deterministic: true