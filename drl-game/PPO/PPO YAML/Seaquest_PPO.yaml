# Seaquest PPO
# Multi-objective game (oxygen, divers, enemies) - PPO handles sparse reward better than DQN
run_name: seaquest_ppo_v0
env_id: ALE/Seaquest-v5
seed: 42
total_timesteps: 15_000_000    # Complex multi-task game needs longer training
n_envs: 8

log_dir:  drl-game/data/runs/seaquest_ppo_v0
save_dir: drl-game/data/models/seaquest_ppo_v0

ppo:
  learning_rate: 2.5e-4
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.015              # Slightly higher entropy to explore oxygen/diver tradeoffs
  vf_coef: 0.5
  max_grad_norm: 0.5

eval:
  enabled: true
  freq: 200_000                # Long eval window - seaquest episodes are variable length
  n_episodes: 3
  deterministic: true